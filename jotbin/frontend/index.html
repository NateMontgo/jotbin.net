<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jotbin is a portfolio of free coding projects that display my growth in skill over time.">
  <title>Home | Jotbin</title>

  <link rel="icon" href="/img/favicon.webp" type="image/png" />
  <link rel="shortcut icon" href="img/favicon.webp" />
  <link rel="stylesheet" href="./css/shared.css">
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>
  <header>
    <a href="." class="logo" title="Home page" >
      <img src="./img/logo.webp" alt="website logo" width="200" height="200">
    </a>
    <h1 class="title-text">Home</h1>
  </header>
  <main>
    <!--* Game icon must have 7:5 aspect ratio -->
    <a href="./alphabet-race" class="project-card desktop-only">
      <img class="project-icon" src="./img/alphabet-race-icon.webp" alt="Alphabet Race" width="672" height="480">
      <h2 class="project-name">Alphabet Race</h2>
    </a>
    <a href="./looped" class="project-card desktop-only">
      <img class="project-icon" src="./img/looped-icon.webp" alt="Looped" width="672" height="480">
      <h2 class="project-name">Looped</h2>
    </a>
    <a href="./15-puzzle" class="project-card">
      <img class="project-icon" src="./img/15-puzzle-icon.webp" alt="15 Puzzle" width="672" height="480">
      <h2 class="project-name">15 Puzzle</h2>
    </a>
    <a href="./pong" class="project-card desktop-only">
      <img class="project-icon" src="./img/pong-icon.webp" alt="Pong" width="672" height="480">
      <h2 class="project-name">Pong</h2>
    </a>

    <h3 class="mobile-notice">(Desktop exclusive projects are hidden)</h2>
    
  </main>
  <footer>
    <h3 class="website-name">jotbin.net</h3>
    <h3 class="copyright-text">© Nate Montgomery</h3>
  </footer>
</body>
</html>
